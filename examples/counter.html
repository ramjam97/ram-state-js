<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- RamStatejs -->
    <script src="../dist/ram-state.min.js"></script>
</head>

<body>
    <div class="container pt-3">
        <h1 class="text-center text-primary">RamState Demo</h1>
        <div class="d-flex flex-column justify-content-center align-items-center">
            <h5 class="counter-text"></h5>
            <span>
                <button class="btn btn-danger" onclick="counter.set(v => --v)">-</button>
                <button class="btn btn-secondary" onclick="counter.set(0)">Reset</button>
                <button class="btn btn-primary" onclick="counter.set(v => ++v)">+</button>
            </span>
            <span>
                <input type="number" class="form-control mt-3" id="counter" placeholder="enter number">
                <input type="text" id="sampleInput" class="form-control form-control-sm">
            </span>
            <span class="counter2"></span>
        </div>
    </div>
</body>
<script>

    const { useState, useEffect } = RamState();

    const counter = useState(0, '#counter', {
        '.counter-text,.counter2': ({ state, el }) => el.innerHTML = `Counter: ${state}`,
        '#sampleInput': ({ state, el }) => el.value = `Counter value: ${state}`,
    });

    console.log(counter);

    counter.watch(({ value }) => {
        console.log('watch counter:', value);
        return () => console.log('watch clean up value:', value);
    });

    counter.watchEffect(({ value }) => {
        console.log('watchEffect counter:', value);
        return () => console.log('watchEffect clean up value:', value);
    });

    useEffect(() => {
        console.log('Counter Change:', counter.value);
    }, [counter]);

    useEffect(() => {
        console.log('Something Change');
    });

</script>

</html>
